<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Verify It's You</title>
</head>

<body style="background: radial-gradient(circle, #2b0c0a 0%, #050508 100%); color: white; text-align: center; font-family: sans-serif; padding-top: 18vh;">

    <form>
        <div style="background-color: #1c1c24; padding: 30px; border-radius: 12px; display: inline-block; width: 320px;">
            
            <h3 style="color: #c9645c; margin-top: 0; margin-bottom: 20px;">verify it's you:</h3>
            
            <input type="email" placeholder="Enter your email" style="color: #c9645c; margin-bottom: 12px; padding: 8px; border-radius: 6px; border: 1px solid #c9645c; background: #0d0d11; width: 90%;">
            <br>
            
            <button type="button" onclick="alert('📨 Verification code sent to your email!')" style="background-color: #c9645c; color: #050508; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 96%; margin-bottom: 25px;">
                send code
            </button>
            <br>
            
            <input type="text" placeholder="Enter 6-digit code" style="color: #c9645c; margin-bottom: 12px; padding: 8px; border-radius: 6px; border: 1px solid #c9645c; background: #0d0d11; width: 90%;">
            <br>
            
            <button type="button" onclick="alert('✅ Identity verified! Access granted.')" style="background-color: #c9645c; color: #050508; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 96%; margin-bottom: 15px;">
                confirm
            </button>
            
        </div>
    </form>

</body>
</html>
