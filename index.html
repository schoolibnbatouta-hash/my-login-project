<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Please Sign-In</title>
</head>

<body style="background: radial-gradient(circle, #2b0c0a 0%, #050508 100%); color: white; text-align: center; font-family: sans-serif; padding-top: 18vh;">

    <form>
        <div style="background-color: #1c1c24; padding: 25px; border-radius: 12px; display: inline-block; width: 320px;">
            
            <h3 style="color: #c9645c; margin-top: 0; margin-bottom: 20px;">please sign-in:</h3>
            
            <!-- Added placeholder names, padding, and dark backgrounds to the inputs -->
            <input type="email" placeholder="Email" style="color: #c9645c; margin-bottom: 15px; padding: 8px; border-radius: 6px; border: 1px solid #c9645c; background: #0d0d11; width: 90%;">
            <br>
            
            <input type="password" placeholder="Password" style="color: #c9645c; margin-bottom: 20px; padding: 8px; border-radius: 6px; border: 1px solid #c9645c; background: #0d0d11; width: 90%;">
            <br>
            
            <!-- Styled your working onclick button to give it a cool background -->
            <button type="button" onclick="alert('hi, user123')" style="background-color: #c9645c; color: #050508; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 96%; margin-bottom: 15px;">
                sign-in
            </button>
            <br>
            
            <!-- \|/ -->
<a href="reset.html" style="color: #c9645c; text-decoration: none; font-size: 14px;">forget password?</a>            
        </div>
    </form>

</body>
</html>
